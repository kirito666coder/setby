services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: setby-web-dev

    ports:
      - '3000:3000'

    volumes:
      - .:/app

      - /app/node_modules

      - /app/.next

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'

    command: pnpm dev
