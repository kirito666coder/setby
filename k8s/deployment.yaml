apiVersion: apps/v1
kind: Deployment
metadata:
  name: setby-web
  namespace: setby
  labels:
    app: setby-web

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: setby-web

  template:
    metadata:
      labels:
        app: setby-web

    spec:
      containers:
        - name: setby-web
          image: ghcr.io/YOUR_USERNAME/setby-web:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: NODE_ENV
              value: production

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
